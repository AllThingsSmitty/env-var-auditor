<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background -->
  <rect width="128" height="128" rx="20" ry="20" fill="#1a1f2e"/>

  <!-- .ENV text; y is the baseline — visual center lands ~y=58 -->
  <text
    x="52"
    y="70"
    font-family="'Courier New', Courier, monospace"
    font-size="30"
    font-weight="700"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="1"
  >.ENV</text>

  <!-- Magnifying glass lens, overlapping the V -->
  <circle cx="88" cy="58" r="17" fill="#2a78d6" fill-opacity="0.15" stroke="#2a78d6" stroke-width="5"/>
  <!-- Handle -->
  <line x1="101" y1="71" x2="114" y2="84" stroke="#2a78d6" stroke-width="5" stroke-linecap="round"/>
</svg>
