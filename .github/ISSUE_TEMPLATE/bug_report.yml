name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill out as much as you can — a minimal reproduction is the fastest path to a fix.

  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: e.g. env-var-auditor@1.0.0
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest command or config that reproduces the issue. Include any relevant `.env` structure or source file snippet.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Node 22, pnpm 9, macOS 15 / Windows 11"
    validations:
      required: true
